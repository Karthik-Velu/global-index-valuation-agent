name: Weekly data refresh

# Re-runs the engine in the cloud each week, commits the new published snapshot
# (dashboard/dashboard_data.json), and triggers a Vercel redeploy. This is the
# hosted equivalent of scripts/weekly_refresh.sh and feeds the auto-tuner.

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch: {}
  # Manual test-fire trigger (this session's GitHub integration lacks actions:write
  # for API dispatch, so push-to-this-file is the only lever — same idiom as
  # backtest.yml/corpactions-backfill.yml). Scoped to the feature branch + this
  # file only, so it never fires from an unrelated commit.
  push:
    branches: ["claude/beautiful-brahmagupta-m0uxps"]
    paths: [".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # ledger/predictions now live in Postgres
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}   # Ollama Cloud — tier-1 for cheap_tags/smart_brief/agents
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # Groq — cross-provider rate-limit fallback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Weekly Tier B maintenance: hydrate (cache, else re-export from Postgres),
      # fold the week's delta files into base, and keep a durable 90-day bundle as
      # an artifact. Non-fatal until the store is initialized — the dashboard
      # refresh below must never be blocked by Tier B housekeeping.
      - name: Restore Tier B store (Parquet)
        uses: actions/cache@v4
        with:
          path: data/tierb
          key: tierb-v1-weekly-${{ github.run_id }}
          restore-keys: |
            tierb-v1-
      - name: Compact + bundle Tier B store
        run: |
          python -m engine.tierbsync pull || echo "Tier B not initialized yet — skipping"
          python -m engine.tierbsync compact || true
          python -m engine.tierbsync bundle || true
      - name: Upload Tier B bundle
        uses: actions/upload-artifact@v4
        with:
          name: tierb-store
          path: data/tierb-store.tar.gz
          if-no-files-found: ignore
          retention-days: 90

      # LLM path is ON: cheap_tags/smart_brief narrative + the Analyst agent (--agent,
      # per-valuation-run cadence per docs/AGENTS.md) run every week; Model-Upgrade
      # (--model-upgrade, monthly cadence) only on the first 7 days of the month. All
      # three degrade gracefully to the deterministic path if OLLAMA_API_KEY/GROQ_API_KEY
      # are ever unset or every model tier is unavailable — never a hard failure here.
      - name: Refresh data (LLM narrative + agents on; degrades to deterministic if no model)
        run: |
          # TEMPORARY: forcing --model-upgrade unconditionally for a one-off manual
          # verification fire (2026-07-24) so Analyst AND Model-Upgrade both get a
          # real end-to-end production test today rather than waiting for the
          # monthly window / next Monday's cron. Reverting to the date-gated
          # version in a follow-up commit once this run is confirmed.
          MU="--model-upgrade"
          python -m engine.cli refresh --no-cache --agent $MU

      - name: Publish snapshot to the static dir
        run: cp data/dashboard_data.json dashboard/dashboard_data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/dashboard_data.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: weekly data refresh [skip ci]"
            git push
          fi

      # Optional: set repo secret VERCEL_DEPLOY_HOOK to auto-redeploy the site.
      # (Vercel → Project → Settings → Git → Deploy Hooks → create one.)
      - name: Trigger Vercel redeploy
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK" || true
