name: Corporate actions backfill — dividends + splits (Massive)

# Bulk date-range backfill of dividends + splits via Massive's v3 reference
# endpoints (ticker-optional, date-range filterable — one paginated query per
# type covers the WHOLE market for the window, not a per-ticker sweep). Fills
# the ~2y history stockvaluation.py's trailing-12-month dividend_yield needs
# (previously hardcoded to 0.0 — see docs/STATUS.md). Postgres-only (low
# volume, relational — same home as `filings`), so no Tier B cache/hydrate
# needed, unlike price-backfill.yml.
#
# Idempotent: dividends/splits use ON CONFLICT DO NOTHING on their natural
# key, so re-running (or the daily pipeline's own ~400d incremental window)
# never duplicates rows.
#
# Trigger: push to THIS FILE on the feature branch (the session's GitHub
# integration lacks actions:write for API dispatch) — matches every other
# CI-fired job this session.
#
# Re-fired 2026-07-22 (1st retry): the first attempt (this file's own creation,
# which also matched its own path filter) raced data-pipeline.yml's simultaneous
# migration-apply step and lost a Postgres catalog race on CREATE TABLE IF
# NOT EXISTS (UniqueViolation on pg_type — confirmed not a real schema
# conflict). Fixed in engine/db.py::apply_migrations() to treat that
# specific race as success.
# Re-fired 2026-07-22 (2nd retry): the 1st retry ran for the full 30-minute
# timeout with ZERO console output, then got cancelled — corpactions.py had no
# progress logging at all, and its default pagination pacing (1s/page) was far
# more aggressive than prices.py's proven-safe 13s/page for this same
# provider/tier, most likely causing repeated silent 429 backoffs. Fixed:
# progress logging added, pacing matched to prices.py's 13s, page size raised
# to the provider's max (5000, was 1000) to cut total round trips ~5x. Timeout
# raised as a safety margin since the real page count for a whole-market 2y
# pull is still unconfirmed.
# Re-fired 2026-07-22 (3rd retry): the 2nd retry "succeeded" in under a
# minute but wrote ZERO rows — both fetches got 400 Bad Request instantly.
# The progress logging added in the 2nd retry's fix is what surfaced this:
# the reference endpoints (dividends/splits) cap `limit` at 1000, a lower
# ceiling than the aggregates endpoints; the 2nd retry's own fix had raised
# it to 5000. Reverted to 1000; _get() now surfaces the response body on any
# non-2xx/429 status so a future 400 is diagnosable from the log directly;
# the CLI now exits non-zero when ingest() reports fetch errors so a
# fully-failed run can no longer report a misleading green success.

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/beautiful-brahmagupta-m0uxps"]
    paths: [".github/workflows/corpactions-backfill.yml"]

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - name: Check required secrets exist
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "::error::MASSIVE_API_KEY secret is missing — add it under repo Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Apply schema migrations (self-healing, idempotent)
        run: python -c "from engine import db; print(db.apply_migrations())"
      - name: Full-history corp actions backfill (~2y, matches price backfill window)
        run: python -m engine.sources.corpactions ingest --full
