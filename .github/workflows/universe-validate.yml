# re-run 2: min-across-frames public-float ranking (scale-error damping)
name: Universe expansion validate (ADR-011)

# One-shot, deliberate: (1) generate stocks_us — top-N US filers ranked by
# dei:EntityPublicFloat via the XBRL frames API — and commit it to the branch;
# (2) ingest the ~30-company cross-region validation batch (the ADR-011
# validate-before-scale step: proves the IFRS canonical mappings and country
# attribution end-to-end on real 20-F/40-F filings); (3) print the per-market
# core-metric coverage report and the data-quality score.
#
# The API/UI dispatch needs actions:write, which the cloud session's GitHub
# integration lacks, so pushing a change to THIS FILE on the feature branch is
# the deliberate trigger (scoped by `paths`).

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/beautiful-brahmagupta-m0uxps"]
    paths: [".github/workflows/universe-validate.yml"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore Tier B store (Parquet)
        uses: actions/cache@v4
        with:
          path: data/tierb
          key: tierb-v1-uvalidate-${{ github.run_id }}
          restore-keys: |
            tierb-v1-
      - name: Generate stocks_us (top-N by public float)
        run: python -m engine.universescan expand-us
      - name: Commit the generated US universe to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/sources/universe_stocks.json
          if git diff --staged --quiet; then echo "No universe changes."; else
            git commit -m "data(universe): stocks_us top-N by public float (universescan)"; git push; fi
      - name: Validate — ingest cross-region batch + coverage + quality
        run: python -m engine.universescan validate
      - name: Upload seed + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-validate
          path: |
            engine/sources/universe_stocks.json
            data/quality_report.json
          if-no-files-found: ignore
          retention-days: 30
