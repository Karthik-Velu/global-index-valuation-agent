name: Price backfill — full stock universe (Stooq)

# Full-history daily OHLCV backfill for every 'stock' security (~2,983 tickers) —
# fires only after price-validate.yml has confirmed the Stooq adapter works
# against the real network. Multi-hour: each ticker is a full-history CSV fetch
# (potentially decades of daily bars), chunked/buffered throughout (PriceWriter
# flushes every 200k rows — memory stays flat regardless of universe size, same
# discipline as the EDGAR bulk-ingest OOM fix).
#
# Trigger: push to THIS FILE on the feature branch (the session's GitHub
# integration lacks actions:write for API dispatch). Deliberately NOT bundled
# into the same commit as price-validate.yml — fired only after inspecting that
# run's result.

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/beautiful-brahmagupta-m0uxps"]
    paths: [".github/workflows/price-backfill.yml"]

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore Tier B store (Parquet)
        uses: actions/cache@v4
        with:
          path: data/tierb
          key: tierb-v1-price-backfill-${{ github.run_id }}
          restore-keys: |
            tierb-v1-
      - name: Hydrate if the cache missed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.tierbsync pull
      - name: Full-history backfill (whole stock universe)
        run: python -m engine.sources.prices ingest --full --sleep 0.15
      - name: Compact + bundle the store
        if: always()
        run: |
          python -m engine.tierbsync compact
          python -m engine.tierbsync bundle
      - name: Publish bundle as release asset (durable hydration source)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tierb-store >/dev/null 2>&1 || \
            gh release create tierb-store --latest --title "Tier B store bundle" \
              --notes "Rolling Parquet bundle of the Tier B metric store, refreshed by CI. Used by \`engine.tierbsync pull\` to hydrate fresh environments post-cutover."
          gh release upload tierb-store data/tierb-store.tar.gz --clobber
      - name: Upload store + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tierb-store-price-backfill
          path: |
            data/tierb-store.tar.gz
            data/datapipeline_report.json
          if-no-files-found: ignore
          retention-days: 90
