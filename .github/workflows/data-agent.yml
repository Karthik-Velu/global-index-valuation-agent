name: Data-ingestion agent

# Runs the data-ingestion agent on a frequent interval: probe every source for
# coverage/cleanliness/freshness/license, rewire the best source per need, and
# surface alerts (broken sources, licensing risk, coverage gaps).
#
# Long-term trend state lives in SQLite today (ephemeral in CI); it moves to the
# cloud DB (architecture Pillar 7) so quality history persists across runs.

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ingest-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run ingestion-improvement pass
        run: python -m engine.dataagent.cli run --sample 10
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataagent-report
          path: data/dataagent_report.json
          retention-days: 30
