name: Data-quality + recalibration

# Validates the ingested data (raises warnings to data_quality_issues) and updates
# the recalibration recommendation (whether a backtest must be redone on corrected
# history). Needs the repo secret DATABASE_URL.

on:
  schedule:
    - cron: "30 6 * * *"   # daily 06:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Data-quality checks
        run: python -m engine.quality run
      - name: Recalibration recommendation
        run: python -m engine.recalibration run
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-reports
          path: |
            data/quality_report.json
            data/recalibration_report.json
          retention-days: 30
