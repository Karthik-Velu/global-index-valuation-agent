name: Screen DSL tests

# Parity + safety tests for the shared screen DSL (ADR-037): the same filter must give
# the same rows in the browser / AI screen builder (dashboard/screen-dsl.js, Node) and
# in the alert jobs (engine/screens.py, Python). Also asserts the parser never maps
# "growth" to a price signal, and that dashboard/*.js declare no clashing top-level names.
#
# No secrets, no database, no network beyond checkout/setup: engine/screens.py is
# stdlib-only; the jobs test installs only pandas/numpy and uses a fake DB connection.
# Safe to run on push to the dev branch. Also validates the Key reports (dashboard/reports/*.json,
# schema v1) and the report renderer's XSS-safety in a fake DOM, and runs the stress-test model
# engine's suite (dashboard/model-engine.js: accounting identities, interest, codec) — Node only,
# no network. And the proposal queue and its three agents (ADR-044): stdlib only, a fake DB,
# a canned model, no network.

on:
  pull_request:
    paths:
      - "dashboard/*.js"
      - "dashboard/screen_fields.json"
      - "dashboard/index.html"
      - "dashboard/reports/**"
      - "scripts/test_reports.js"
      - "scripts/test_model.js"
      - "dashboard/model-engine.js"
      - "tests/fixtures/models/**"
      - "engine/screens.py"
      - "engine/screenjobs.py"
      - "engine/picks.py"
      - "engine/reports.py"
      - "engine/tierb.py"
      - "engine/tierbdump.py"
      - "engine/shares.py"
      - "engine/sharescensus.py"
      # the census reproduces today's resolver with these; its goldens guard them
      - "engine/stockvaluation.py"
      - "engine/growthhistory.py"
      - "engine/sources/edgar.py"
      - "engine/sources/catalog.py"
      - "engine/sources/metric_catalog.json"
      - "engine/catalogaudit.py"
      - ".github/workflows/catalog-audit.yml"
      - "engine/sectoragent/tagging.py"
      - "engine/dailyplan.py"
      - "engine/canonical.py"
      - "engine/proposals.py"
      - "engine/quality.py"
      - "engine/qualitytriage.py"
      - "engine/datapipeline.py"
      - "engine/dataagent/agent.py"
      - "engine/dataagent/discover.py"
      - "engine/sectoragent/research.py"
      - "engine/sectoragent/sic_map.py"
      - "engine/sources/registry.py"
      - "engine/migrations/0017_needs_register.sql"
      - "supabase/functions/admin/index.ts"
      - "tests/**"
      - "scripts/test_screens.js"
      - "scripts/test_screen_builder.js"
      - "api/**"
      - ".vercelignore"
      - ".github/workflows/screens-tests.yml"
  push:
    branches: ["claude/beautiful-brahmagupta-m0uxps"]
    paths:
      - "dashboard/*.js"
      - "dashboard/screen_fields.json"
      - "dashboard/index.html"
      - "dashboard/reports/**"
      - "scripts/test_reports.js"
      - "scripts/test_model.js"
      - "dashboard/model-engine.js"
      - "tests/fixtures/models/**"
      - "engine/screens.py"
      - "engine/screenjobs.py"
      - "engine/picks.py"
      - "engine/reports.py"
      - "engine/tierb.py"
      - "engine/tierbdump.py"
      - "engine/shares.py"
      - "engine/sharescensus.py"
      # the census reproduces today's resolver with these; its goldens guard them
      - "engine/stockvaluation.py"
      - "engine/growthhistory.py"
      - "engine/sources/edgar.py"
      - "engine/sources/catalog.py"
      - "engine/sources/metric_catalog.json"
      - "engine/catalogaudit.py"
      - ".github/workflows/catalog-audit.yml"
      - "engine/sectoragent/tagging.py"
      - "engine/dailyplan.py"
      - "engine/canonical.py"
      - "engine/proposals.py"
      - "engine/quality.py"
      - "engine/qualitytriage.py"
      - "engine/datapipeline.py"
      - "engine/dataagent/agent.py"
      - "engine/dataagent/discover.py"
      - "engine/sectoragent/research.py"
      - "engine/sectoragent/sic_map.py"
      - "engine/sources/registry.py"
      - "engine/migrations/0017_needs_register.sql"
      - "supabase/functions/admin/index.ts"
      - "tests/**"
      - "scripts/test_screens.js"
      - "scripts/test_screen_builder.js"
      - "api/**"
      - ".vercelignore"
      - ".github/workflows/screens-tests.yml"

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: DSL parity, parser and global-name checks (Node)
        run: node scripts/test_screens.js
      - name: Key reports (schema v1 + renderer in a fake DOM, no network)
        run: node scripts/test_reports.js
      - name: Stress-test model engine (Node, no network)
        run: node scripts/test_model.js
      - name: AI screen builder (stubbed fetch, no network)
        run: |
          if [ -f scripts/test_screen_builder.js ]; then node scripts/test_screen_builder.js
          else echo "scripts/test_screen_builder.js not present — skipped"; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: DSL parity (Python, stdlib only)
        run: python tests/test_screens.py
      - name: Key-report financials job (de-cumulation, vintages, rounding bounds; stdlib only)
        run: python tests/test_reports_engine.py
      - name: Screen jobs (fake DB connection, no network)
        run: |
          pip install --quiet "pandas>=2.2" "numpy>=1.26"
          python tests/test_screenjobs.py
      - name: Tagging scope (D02 rotation, time budget, kill switch; fake DB, no network)
        run: |
          pip install --quiet requests
          python tests/test_tagging.py
      - name: Daily plan loop (day comment, owner-only replies, publish guards; fake GitHub API)
        run: python tests/test_dailyplan.py
      - name: Proposal queue (canonical keys, needs gating, expiry, no catalogue clobber; fake DB)
        run: python tests/test_proposals.py
      - name: Proposal agents (needs seed, licence gate, rotation, XBRL gate; fake DB, no network)
        run: python tests/test_agents.py
      - name: Tier B dump presets (parameters bound, no prices view; in-memory DuckDB)
        run: |
          pip install --quiet "duckdb>=1.0,<2"
          python tests/test_tierbdump.py
      - name: Share census (S0 goldens, store vs simulation, licence guard; in-memory DuckDB)
        run: |
          pip install --quiet "duckdb>=1.0,<2" "pandas>=2.2" "numpy>=1.26" requests
          python tests/test_shares_census.py
      - name: Catalogue audit (every verdict, no prices view, writes nothing; in-memory DuckDB)
        run: |
          pip install --quiet "duckdb>=1.0,<2"
          python tests/test_catalogaudit.py
