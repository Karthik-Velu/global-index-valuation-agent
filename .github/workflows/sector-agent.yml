name: Sector-intelligence agent

# Weekly: re-tag stocks by sector, validate the KPI catalog against real filings,
# auto-fix mis-mapped tags, and commit any catalog self-corrections. Needs the repo
# secret DATABASE_URL (Supabase). SEC_USER_AGENT secret is recommended (a contact
# string for SEC fair-use); falls back to a default otherwise.

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run sector-intelligence pass
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m engine.sectoragent.cli run
      - name: Commit catalog self-corrections if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/sources/metric_catalog.json
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: sector agent auto-corrected metric catalog [skip ci]"
            git push
          fi
