name: Price ingestion — validation (Massive)

# First real-network test of the Massive adapter (engine/sources/prices.py,
# ADR-017) — the fail-fast gate before the multi-hour full backfill:
#   1. one recent grouped-daily call must cover >=25 of the 30 validation_batch
#      tickers AND include SPY + sample index-proxy ETFs (ETF coverage in
#      market=stocks is strongly indicated but not verbatim-documented — this
#      assertion is the proof)
#   2. history-depth probes at ~22 months / 3y / 6y back report the key's real
#      entitlement window (free tier is documented as 2 years)
#   3. a per-ticker range call exercises the second endpoint + ET date handling
#
# Requires the MASSIVE_API_KEY secret (repo Settings > Secrets > Actions) —
# fails immediately with a clear message if missing.
# Trigger: push to THIS FILE on the feature branch (the session's GitHub
# integration lacks actions:write for API dispatch).
# Fired 2026-07-20: MASSIVE_API_KEY secret added, first real-network run.
# Re-fired 2026-07-20 (control test): backtest.yml is failing at startup
# with 0 billable ms; touching this already-proven-working file to check
# whether push-triggered workflows are still firing correctly right now.

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/beautiful-brahmagupta-m0uxps"]
    paths: [".github/workflows/price-validate.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PRICES_DEBUG: "1"
    steps:
      - name: Check MASSIVE_API_KEY secret exists
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "::error::MASSIVE_API_KEY secret is missing — sign up free at massive.com and add the key under repo Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Grouped-daily coverage + ETF assertion + history-depth probes
        run: |
          python - <<'EOF'
          import time
          import datetime as dt
          from engine import universescan
          from engine.sources import prices

          def last_weekday(d):
              while d.weekday() >= 5:
                  d -= dt.timedelta(days=1)
              return d

          PACE = 13  # seconds between calls — free tier is 5 req/min

          # 1. recent grouped day: universe + ETF coverage
          day = last_weekday(dt.date.today() - dt.timedelta(days=4))
          df = prices.fetch_grouped_daily(day)
          got = set(df["ticker"].str.upper()) if not df.empty else set()
          print(f"grouped {day}: {len(got)} tickers returned")
          batch = [t.upper() for t in universescan.load_seed().get("validation_batch", [])]
          covered = [t for t in batch if t in got]
          print(f"validation_batch coverage: {len(covered)}/{len(batch)} — missing: "
                f"{sorted(set(batch) - got)}")
          etf_sample = ["SPY", "EWJ", "EWG", "IXN", "VT"]
          etfs_found = [t for t in etf_sample if t in got]
          print(f"ETF coverage: {etfs_found} of {etf_sample}")
          assert len(covered) >= 25, f"FAIL: only {len(covered)}/30 validation tickers covered"
          assert "SPY" in got, "FAIL: SPY missing from grouped daily — ETFs NOT covered"
          spy_close = float(df[df["ticker"].str.upper() == "SPY"]["close"].iloc[0])
          assert 100 < spy_close < 2000, f"FAIL: SPY close {spy_close} implausible"

          # 2. history-depth probes (free tier documented at 2 years)
          for months_back, label in ((22, "~22mo (inside free window)"),
                                     (36, "3y (Starter territory)"),
                                     (72, "6y (Developer territory)")):
              time.sleep(PACE)
              probe = last_weekday(dt.date.today() - dt.timedelta(days=months_back * 30))
              try:
                  pdf = prices.fetch_grouped_daily(probe)
                  print(f"depth probe {label} ({probe}): {len(pdf)} tickers -> "
                        f"{'DATA' if len(pdf) else 'EMPTY'}")
              except prices.NotEntitled:
                  print(f"depth probe {label} ({probe}): 403 NOT_AUTHORIZED (beyond plan)")
              except prices.RateLimited as e:
                  print(f"depth probe {label} ({probe}): rate-limited ({e}) — pacing issue")

          # 3. per-ticker range endpoint + ET date handling
          time.sleep(PACE)
          rng = prices.fetch_ticker_range("AAPL", dt.date.today() - dt.timedelta(days=30),
                                          dt.date.today())
          assert rng is not None and len(rng) >= 15, f"FAIL: AAPL range returned {rng}"
          print(f"per-ticker range OK: AAPL {len(rng)} bars, "
                f"{rng['date'].iloc[0]}..{rng['date'].iloc[-1]}, "
                f"last close {rng['close'].iloc[-1]}")

          print("PASS: Massive adapter validated against the real service")
          EOF
