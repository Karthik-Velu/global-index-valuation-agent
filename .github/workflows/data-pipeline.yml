name: Data pipeline (job)

# One deterministic job: probe sources -> ingest (EDGAR) -> tag -> validate catalog
# -> data-quality -> recalibration check, in sequence. Validation runs right after
# ingestion (not as separate crons). Needs repo secret DATABASE_URL; SEC_USER_AGENT
# recommended. LLM "agents" are separate and infrequent (see docs/AGENTS.md).

# Ingestion is INCREMENTAL daily (only companies that filed in the last few
# days, via EDGAR's daily index — keeps runtime flat as the universe grows)
# with a full re-feed sweep on the FIRST Sunday of each month (PK-dedup makes
# it a cheap no-op for unchanged data; it is the safety net for anything the
# daily index missed). At 3,000+ companies a full sweep is multi-hour, so
# monthly keeps the Actions budget sane.
on:
  schedule:
    - cron: "0 6 * * 1-6"   # Mon-Sat 06:00 UTC — incremental
    - cron: "0 4 * * 0"     # Sundays 04:00 UTC — full sweep on the 1st Sunday only
  workflow_dispatch:
    inputs:
      full:
        description: "full re-feed of the whole universe"
        type: boolean
        default: false
  # Editing this file on the dev branch fires one verification run there —
  # useful because pipeline changes can't be API-dispatched from sessions
  # (no actions:write) and scheduled runs only exercise main.
  push:
    branches: ["claude/beautiful-brahmagupta-m0uxps"]
    paths: [".github/workflows/data-pipeline.yml"]

permissions:
  contents: write

# One Tier B writer at a time per branch (shared with refresh.yml). Overlapping
# runs restore the same cache and the later save wins, silently dropping the
# other run's rows. Caches are branch-scoped, so the group is too. queue: max —
# the default keeps only one pending run and cancels it when another queues.
# Phase 0 P0.1a.
concurrency:
  group: tierb-writer-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    # GitHub kills a hosted job at 360 min and a killed job saves nothing. The
    # pipeline step is capped at 320 so the save steps below always get to run
    # (P0.1a — the full sweep reached 308 min on 2026-10-04).
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}   # Ollama Cloud — tier-1 for the LLM agents
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # Groq — cross-provider rate-limit fallback
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }} # Massive — EOD prices (2c) + corp actions (2d)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      # Tier B (Parquet) store persists across daily runs via the cache; the unique
      # key + prefix restore-keys give a rolling latest-wins cache. Until the store
      # is initialized (engine.tierbsync export) this restores nothing and the
      # pipeline's Tier B step is a no-op. Restore and save are separate steps so
      # the save also runs when the pipeline fails or hits its time cap (the
      # combined actions/cache only saved on success, so a killed sweep lost all
      # of its work) — P0.1a.
      - name: Restore Tier B store (Parquet)
        uses: actions/cache/restore@v4
        with:
          path: data/tierb
          key: tierb-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tierb-v1-
      # Actions caches are BRANCH-scoped: main can't see caches saved by
      # feature-branch runs, so the first post-cutover daily on main aborted
      # (store missing + Postgres empty, 2026-07-08). On a miss, pull
      # hydrates from the tierb-store release asset; with the store present
      # it's a fast no-op.
      - name: Hydrate Tier B if the cache missed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.tierbsync pull
      - name: Refresh universe (monthly full sweep only)
        run: |
          if { [ "${{ github.event.schedule }}" = "0 4 * * 0" ] && [ "$(date -u +%-d)" -le 7 ]; } || [ "${{ inputs.full }}" = "true" ]; then
            python -m engine.universescan expand-us
            python -m engine.universescan discover-foreign
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add engine/sources/universe_stocks.json
            git diff --staged --quiet || { git commit -m "data(universe): monthly refresh (universescan) [skip ci]"; git push; }
          else
            echo "incremental day — universe refresh skipped"
          fi
      - name: Run data pipeline (with agents; they no-op gracefully if no key)
        id: pipeline
        timeout-minutes: 320
        continue-on-error: true
        run: |
          FULL=""
          if [ "${{ github.event.schedule }}" = "0 4 * * 0" ] && [ "$(date -u +%-d)" -le 7 ]; then FULL="--full"; fi
          if [ "${{ inputs.full }}" = "true" ]; then FULL="--full"; fi
          # exec + timeout: on a step timeout/cancel the runner signals only this
          # step's shell, which would leave python running (and writing Parquet)
          # while the check/save steps below run. exec hands the signal to
          # timeout, which forwards it; the 315m cap + kill-after ends python
          # before the 320-min step cap. --foreground: signal only python, never
          # timeout's process group.
          exec timeout --foreground --signal=INT --kill-after=120 315m python -m engine.datapipeline --agents $FULL
      # No monthly tierb-store release refresh any more (Phase 0 P0.5a): this repo
      # is public and the bundle carries Massive bars licensed for personal use
      # only. The 2026-10-04 asset stays frozen as the disaster-recovery copy that
      # `tierbsync pull` falls back to, until private encrypted backups exist
      # (P0.2) — then it is deleted.
      # Delta files are written in place (not tmp+rename), so a run cut off
      # mid-write can leave a truncated Parquet file. Save the store only if every
      # file still reads and neither dataset is empty; otherwise keep the previous
      # cache (the next run re-ingests the 7-day window).
      - name: Check Tier B store is readable
        id: tierb_check
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from engine import tierb
          s = tierb.stats()
          assert s["fundamental_metrics"] > 0 and s["prices"] > 0, s
          print(f"store ok: {s['fundamental_metrics']:,} metric rows, {s['prices']:,} price rows, "
                f"{s['base_files']} base + {s['delta_files']} delta files")
          PY
      - name: Save Tier B store (Parquet)
        if: always() && steps.tierb_check.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/tierb
          # run_attempt: a re-run keeps run_id, and the cache never overwrites a
          # key, so without it a re-run's save is silently dropped.
          key: tierb-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit catalog self-corrections if any
        if: steps.pipeline.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/sources/metric_catalog.json
          if git diff --staged --quiet; then echo "No catalog changes."; else
            git commit -m "chore: data pipeline auto-corrected metric catalog [skip ci]"; git push; fi
      # Public artifact — counts, EDGAR-derived quality issues and store counts
      # only; nothing here may carry Massive prices or valuations (P0.5a).
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-pipeline-reports
          path: |
            data/datapipeline_report.json
            data/quality_report.json
            data/recalibration_report.json
            data/tierb/manifest.json
          retention-days: 30
      # The pipeline step is continue-on-error (so the save above runs); fail the
      # job here so a failed or timed-out run stays red.
      - name: Fail the job if the pipeline or the store check failed
        if: always() && (steps.pipeline.outcome != 'success' || steps.tierb_check.outcome != 'success')
        run: |
          echo "::error::pipeline=${{ steps.pipeline.outcome }} store_check=${{ steps.tierb_check.outcome }}"
          exit 1
