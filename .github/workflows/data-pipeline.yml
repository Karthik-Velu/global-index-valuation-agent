name: Data pipeline (job)

# One deterministic job: probe sources -> ingest (EDGAR) -> tag -> validate catalog
# -> data-quality -> recalibration check, in sequence. Validation runs right after
# ingestion (not as separate crons). Needs repo secret DATABASE_URL; SEC_USER_AGENT
# recommended. LLM "agents" are separate and infrequent (see docs/AGENTS.md).

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}   # Ollama Cloud — tier-1 for the LLM agents
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # Groq — cross-provider rate-limit fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      # Tier B (Parquet) store persists across daily runs via the cache; the unique
      # key + prefix restore-keys give a rolling latest-wins cache. Until the store
      # is initialized (engine.tierbsync export) this restores nothing and the
      # pipeline's Tier B step is a no-op.
      - name: Restore Tier B store (Parquet)
        uses: actions/cache@v4
        with:
          path: data/tierb
          key: tierb-v1-${{ github.run_id }}
          restore-keys: |
            tierb-v1-
      - name: Run data pipeline (with agents; they no-op gracefully if no key)
        run: python -m engine.datapipeline --agents
      - name: Commit catalog self-corrections if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/sources/metric_catalog.json
          if git diff --staged --quiet; then echo "No catalog changes."; else
            git commit -m "chore: data pipeline auto-corrected metric catalog [skip ci]"; git push; fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-pipeline-reports
          path: |
            data/datapipeline_report.json
            data/quality_report.json
            data/recalibration_report.json
            data/tierb/manifest.json
          retention-days: 30
